server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/llm_eval?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    listener:
      auto-startup: true
    consumer:
      group-id: llm-eval-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  access-key: ${MINIO_USER:minioadmin}
  secret-key: ${MINIO_PASSWORD:minioadmin}
  bucket-name: ${MINIO_BUCKET:llm-eval}

eval:
  encrypt:
    secret-key: ${EVAL_ENCRYPT_KEY:}
  security:
    # 注册邀请码：非空时开放自助注册，注册必须提交一致邀请码；
    # 置空则关闭注册（只能登录）。生产环境务必通过 EVAL_REGISTER_CODE 修改。
    register-code: ${EVAL_REGISTER_CODE:evalia80}
    # JWT 签名密钥（HS256，建议 ≥32 字符）。生产必须通过 EVAL_JWT_SECRET 覆盖。
    jwt-secret: ${EVAL_JWT_SECRET:EVALIA_DEV_JWT_SECRET_CHANGE_ME_0123456789}
    # JWT 有效期（小时）
    jwt-expire-hours: ${EVAL_JWT_EXPIRE_HOURS:72}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.eval.web.controller
